# Most Taiwanese stations stream AAC, not MP3 (plan/radio.md has the probe),
# so the page needs a second decoder. Espressif's own, under their licence.
# No `rules:` guard on MUSE_RADIO_ENABLED: it is a prebuilt static library
# and nothing references it when the page is compiled out, so the linker drops
# it. The download happens either way, which is the whole cost.
dependencies:
  espressif/esp_audio_codec: "~2.6"

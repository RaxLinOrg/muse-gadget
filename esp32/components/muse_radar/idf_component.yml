dependencies:
  # The radar page decodes RainViewer's PNG tiles for the weather mode and
  # opens a websocket to aisstream.io for the ships one. Both already come in
  # with the firmware's other dependencies; naming them here keeps the page
  # honest about what it uses.
  espressif/libpng: "^1.6.0"
  espressif/esp_websocket_client: "^1.2.0"
